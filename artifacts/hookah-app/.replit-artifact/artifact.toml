kind = "web"
previewPath = "/"
title = "Hookah Club"
version = "1.0.0"
id = "artifacts/hookah-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24071

[services.development]
run = "pnpm --filter @workspace/hookah-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hookah-app", "run", "build" ]
publicDir = "artifacts/hookah-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24071"
BASE_PATH = "/"
